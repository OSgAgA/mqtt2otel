baseURL = 'https://mqtt2otel.org/'
languageCode = 'en-us'
title = 'mqtt2otel'
theme = 'hugo-book'

enableRobotsTXT = true

[markup]
  [markup.goldmark.renderer]
    unsafe = true

  [markup.goldmark.renderHooks.image]
    useEmbedded = 'fallback'

  [markup.goldmark.renderHooks.link]
    useEmbedded = 'fallback'

  [markup.highlight]
    codeFences = true       # Enable fenced code block highlighting
    guessSyntax = false     # Don't guess language if not specified
    lineNos = true          # Enable line numbers
    lineNumbersInTable = true # false = inline numbers, true = table style
    style = 'lovelace'