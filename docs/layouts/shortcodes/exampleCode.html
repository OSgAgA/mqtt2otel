{{ $id := .Get "id" }}
{{ $field := .Get "field" }}
{{ $lang := .Get "lang" | default "yaml" }}
{{ $hl := .Get "hl_lines" }}

{{ $opts := dict "hl_lines" $hl }}

{{ range hugo.Data.examples }}
{{ if eq .Setup.Id $id }}
    <div class="code-meta" data-id="{{ $id }}">
        {{ highlight (index .Setup $field) $lang $opts }}
    </div>
{{ break }}
{{ end }}
{{ end }}
