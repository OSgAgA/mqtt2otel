name: PublishDocs

# Workflow can 
#   * write repositroy content
#   * create and update GitHub Checks.
#   * comment on PRs, update PR statuses, or modify PR metadata.
permissions:
  contents: write
  checks: write
  pull-requests: write

# Only executed on pushes to the main branch.
on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'workflows/publish_pages.yaml'

jobs:
  # Deploy the documentation to github-pages.
  deploy-docs:
    name: Deploy Hugo Docs
    runs-on: ubuntu-latest

    # Workflow can 
    #   * read repositroy content
    #   * deploy github pages.
    #   * request an OIDC token (OpenID Connect). Needed as actions/deploy-pages@v4 uses OIDC internally.
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      # Checkout the repository.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure directory for json examples exists
        run: mkdir -p docs/data/examples

      - name: Copy json examples to documentation.
        run: cp -R mqtt2otel.Metadata/TestCases docs/data/examples
  
      # Setup Hugo static side generator.
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true
  
      # Build the static html via hugo. The static html is written to the public directory inside ./docs.
      - name: Build Hugo site
        working-directory: ./docs
        run: hugo --minify

      # Check whether all links are valid.
      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >
            --verbose
            --no-progress
            --accept 200
            --root-dir ./docs/public
            ./docs/public/**/*.html
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  
      # Upload the generated static html as a github-pages-artifact.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs/public
  
      # Deploy the artifact to github-pages.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4